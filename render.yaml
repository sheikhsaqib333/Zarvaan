services:
  - type: web
    name: zarvaan-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run dev:server
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: STORE_DATA_DIR
        value: /var/data
      - key: ADMIN_PASSCODE
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
    disk:
      name: zarvaan-store-data
      mountPath: /var/data
      sizeGB: 1
